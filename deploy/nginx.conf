# Install as an additional server block. Check DNS and certificates first.
# Log $uri, never $request/$request_uri, to omit customer search terms.
log_format sales_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
server {
    listen 80;
    server_name sales.omfreight.vip;
    location /.well-known/acme-challenge/ { root /var/www/freight-acme; }
    location / { return 301 https://$host$request_uri; }
    access_log /var/log/nginx/sales-workbench.access.log sales_safe;
}
server {
    listen 443 ssl;
    server_name sales.omfreight.vip;
    ssl_certificate /etc/letsencrypt/live/sales.omfreight.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sales.omfreight.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    access_log /var/log/nginx/sales-workbench.access.log sales_safe;
    error_log /var/log/nginx/sales-workbench.error.log warn;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:3106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
